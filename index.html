<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Fetcher | Video & Audio Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .icon-header {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff4b4b, #ff0055);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(255, 0, 85, 0.3);
        }

        .icon-header svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 20px;
        }

        select option {
            background: #0f172a;
            color: #fff;
        }

        input:focus, select:focus {
            border-color: #ff0055;
            box-shadow: 0 0 0 4px rgba(255, 0, 85, 0.15);
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff4b4b 0%, #ff0055 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
            color: #cbd5e1;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-header">
        <svg viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
    </div>
    <h2>Media Downloader</h2>
    <p class="subtitle">YouTube link paste karke Video (MP4) ya Audio (MP3) download karein</p>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="https://youtube.com/watch?v=...">
    </div>

    <div class="input-group">
        <select id="downloadType">
            <option value="video">MP4 Video Format</option>
            <option value="mp3">MP3 Audio Format</option>
        </select>
    </div>

    <button id="downloadBtn" onclick="handleDownload()">
        <span>Download Now</span>
    </button>

    <div id="status"></div>
</div>

<script>
    async function handleDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const downloadType = document.getElementById('downloadType').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('downloadBtn');

        if (!urlInput) {
            status.style.color = '#f87171';
            status.innerText = "Kripya valid YouTube link paste karein!";
            return;
        }

        status.style.color = '#cbd5e1';
        status.innerHTML = '<span class="spinner"></span> Processing media file...';
        btn.disabled = true;

        try {
            const response = await fetch('http://127.0.0.1:5000/download', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    url: urlInput,
                    type: downloadType 
                }),
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || "Download fail ho gaya. Server log dekhein.");
            }

            // Extract filename from response headers if available
            let filename = downloadType === 'mp3' ? 'Audio.mp3' : 'Video.mp4';
            const disposition = response.headers.get('Content-Disposition');
            if (disposition && disposition.includes('filename=')) {
                const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                if (match && match[1]) {
                    filename = match[1].replace(/['"]/g, '');
                }
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            status.style.color = '#4ade80';
            status.innerText = `✓ ${downloadType.toUpperCase()} Downloaded Successfully!`;
        } catch (error) {
            status.style.color = '#f87171';
            status.innerText = "Error: " + error.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
